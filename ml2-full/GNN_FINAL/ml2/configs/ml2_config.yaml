data:
  canonical_ucs_dir: "ml2/data/ucs"
  windows_file: "ml2/data/ucs/ucs_windows.parquet"
  graph_edges_file: "ml2/data/ucs/ucs_graph_edgelists.parquet"
  node_lookup_file: "ml2/data/ucs/node_lookup.parquet"
  scaler_params_file: "ml2/data/ucs/scaler_params.yaml"
  base_path: "E:/SIH 2026 - Unified Cyber State ingestion pipeline/SIH 2026 - Unified Cyber State ingestion pipeline/data/processed/ucs_v1"

graph:
  snapshot_freq_sec: 60

model:
  node_feature_dim: 11
  hidden_dim: 64
  embedding_dim: 64
  fusion_hidden_dim: 128
  num_layers: 2
  dropout: 0.3
  pooling: "mean"

splits:
  mode: "chronological"
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15

training:
  lr: 0.001
  epochs: 100
  patience: 15
  batch_size: 32
  max_grad_norm: 1.0

ml1_interface:
  z_dim: 64
  output_dir: "ml2/data/ml1_artifacts/deviation_predictions.csv"  # Now a specific CSV instead of dir

temporal_encoder:
  windows_path: "ml2/data/ucs/ucs_windows.parquet"
  metadata_path: "ml2/data/ml1_artifacts/reproducibility_metadata.json"
  scaler_path: "ml2/data/ucs/scaler_params.yaml"
  checkpoint_path: "ml2/data/ml1_artifacts/gaussian_next_state_best.pt"

ablation:
  model_types: ["fused", "temporal_only"]
  K_values: [1, 2, 3, 5, 10]

loeo:
  min_episodes: 2
  purge_window: 10  # Example purge window size, to be implemented
  embargo_window: 10 # Example embargo window size, to be implemented
