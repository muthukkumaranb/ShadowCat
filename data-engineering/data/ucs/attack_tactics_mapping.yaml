# ATT&CK Tactic Mapping for CSE-CIC-IDS2018
# Maps each dataset attack label to MITRE ATT&CK tactics for downstream World Model alignment.

mappings:
  "FTP-BruteForce":
    tactic: "Credential Access"
    technique_id: "T1110.001"
    technique_name: "Brute Force: Password Guessing"
    confidence: "clean"
    justification: "Repeated authentication attempts against FTP service (port 21)."
    
  "SSH-Bruteforce":
    tactic: "Credential Access"
    technique_id: "T1110.001"
    technique_name: "Brute Force: Password Guessing"
    confidence: "clean"
    justification: "Repeated authentication attempts against SSH service (port 22)."

  "DDOS-HOIC":
    tactic: "Impact"
    technique_id: "T1498.001"
    technique_name: "Network Denial of Service: Direct Network Flood"
    confidence: "evidence-dependent"
    justification: "High-volume HTTP GET/POST flood designed to exhaust server resources. Evidence depends on volume relative to normal baseline."

  "DDOS-LOIC-UDP":
    tactic: "Impact"
    technique_id: "T1498.001"
    technique_name: "Network Denial of Service: Direct Network Flood"
    confidence: "evidence-dependent"
    justification: "High-volume UDP flood designed to exhaust network bandwidth. Contains single-window episodes that are hard to distinguish without volume baseline."

  "Botnet":
    tactic: "Command and Control"
    technique_id: "T1071.001"
    technique_name: "Application Layer Protocol: Web Protocols"
    confidence: "clean"
    justification: "Botnet C2 check-ins and beaconing activity over standard ports."

  "Web-BruteForce":
    tactic: "Credential Access"
    technique_id: "T1110.001"
    technique_name: "Brute Force: Password Guessing"
    confidence: "clean"
    justification: "Repeated login attempts against web applications."

  "Web-XSS":
    tactic: "Initial Access"
    technique_id: "T1190"
    technique_name: "Exploit Public-Facing Application"
    confidence: "defensible-if-observed"
    justification: "Cross-site scripting attempts against web server. Often difficult to distinguish from benign traffic purely via flow statistics without payload inspection."

  "Web-SQLi":
    tactic: "Credential Access / Initial Access"
    technique_id: "T1190"
    technique_name: "Exploit Public-Facing Application"
    confidence: "defensible-if-observed"
    justification: "SQL injection attempts. Often difficult to distinguish from benign traffic purely via flow statistics without payload inspection."

  "Infiltration-Compromise":
    tactic: "Initial Access"
    technique_id: "T1189"
    technique_name: "Drive-by Compromise"
    confidence: "evidence-dependent"
    justification: "Initial malware drop and victim connection to C2. Difficult to label reliably without host context."

  "Infiltration-Portscan":
    tactic: "Discovery"
    technique_id: "T1046"
    technique_name: "Network Service Discovery"
    confidence: "clean"
    justification: "Nmap sweeps across the internal network for lateral movement planning."
