model:
  dropout: 0.2
  hidden_size: 64
  num_layers: 1
training:
  batch_size: 64
  early_stopping:
    min_delta: 0.001
    patience: 10
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001
world_model:
  intervals:
    levels:
    - 0.8
  rollout:
    horizons:
    - 1
    - 2
    - 3
    - 4
    - 5
  seed: 42
